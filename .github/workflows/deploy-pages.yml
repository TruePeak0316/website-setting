name: Deploy GitHub Pages
run-name: ${{ github.event_name == 'workflow_dispatch' && format('CMS|{0}|{1}|{2}|{3}|{4}|{5}', inputs.deployment_id, inputs.release_id, inputs.site_key, inputs.attempt_number, inputs.commit_sha, inputs.publish_mode) || github.event.head_commit.message }}

on:
  push:
    branches: ["main"]
  workflow_dispatch:
    inputs:
      deployment_id:
        description: CMS deployment UUID
        required: true
        type: string
      release_id:
        description: Immutable CMS release UUID
        required: true
        type: string
      site_key:
        description: CMS site key
        required: true
        type: string
      attempt_number:
        description: CMS deployment attempt number
        required: true
        type: string
      commit_sha:
        description: Full content commit SHA
        required: false
        type: string
      publish_mode:
        description: preview or production
        required: false
        type: string
      content_api_url:
        description: Legacy CMS API base URL (new local publishing leaves this empty)
        required: false
        type: string

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: ${{ github.event_name == 'push' && 'cms-push' || github.ref == 'refs/heads/main' && 'cms-pages-production' || 'cms-preview' }}
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name == 'push' || inputs.content_api_url == ''
    runs-on: ubuntu-latest
    steps:
      - name: Validate CMS dispatch
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          ATTEMPT_NUMBER: ${{ inputs.attempt_number }}
          COMMIT_SHA: ${{ inputs.commit_sha }}
          DEPLOYMENT_ID: ${{ inputs.deployment_id }}
          RELEASE_ID: ${{ inputs.release_id }}
          SITE_KEY: ${{ inputs.site_key }}
          PUBLISH_MODE: ${{ inputs.publish_mode }}
          REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          uuid='^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-5][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$'
          [[ "$DEPLOYMENT_ID" =~ $uuid && "$RELEASE_ID" =~ $uuid ]] || { echo '::error::Invalid deployment or release ID'; exit 1; }
          [[ "$SITE_KEY" =~ ^[a-z0-9][a-z0-9_-]{0,63}$ ]] || { echo '::error::Invalid site key'; exit 1; }
          [[ "$ATTEMPT_NUMBER" =~ ^[1-9][0-9]*$ ]] || { echo '::error::Invalid attempt number'; exit 1; }
          [[ "$COMMIT_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo '::error::Expected a full lowercase content commit SHA'; exit 1; }
          [[ "$PUBLISH_MODE:$REF" == 'preview:refs/heads/dev' || "$PUBLISH_MODE:$REF" == 'production:refs/heads/main' ]] || { echo '::error::Publish mode and branch do not match'; exit 1; }

      - name: Checkout content commit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.commit_sha || github.sha }}
          fetch-depth: 0

      - name: Validate immutable snapshot
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          COMMIT_SHA: ${{ inputs.commit_sha }}
          RELEASE_ID: ${{ inputs.release_id }}
          SITE_KEY: ${{ inputs.site_key }}
          REF_NAME: ${{ github.ref_name }}
          PUBLISH_MODE: ${{ inputs.publish_mode }}
        run: |
          set -euo pipefail
          [[ "$(git rev-parse HEAD)" == "$COMMIT_SHA" ]] || { echo '::error::Wrong content commit'; exit 1; }
          git fetch --no-tags origin "+refs/heads/$REF_NAME:refs/remotes/origin/$REF_NAME"
          git merge-base --is-ancestor "$COMMIT_SHA" "refs/remotes/origin/$REF_NAME" || { echo '::error::Content commit is not on the selected branch'; exit 1; }
          snapshot="$GITHUB_WORKSPACE/content/published-content-v1.json"
          [[ -f "$snapshot" ]] || { echo '::error::CMS snapshot is missing'; exit 1; }
          jq -e --arg release "$RELEASE_ID" --arg site "$SITE_KEY" --arg mode "$PUBLISH_MODE" '.schemaVersion == "1.0" and .releaseId == $release and .siteKey == $site and .publishMode == $mode and (.releaseNumber | type == "number" and . >= 1 and floor == .)' "$snapshot" >/dev/null || { echo '::error::CMS snapshot identity does not match'; exit 1; }
          {
            echo 'CMS_CONTENT_REQUIRED=1'
            echo "CMS_EXPECTED_RELEASE_ID=$RELEASE_ID"
            echo "CMS_EXPECTED_SITE_KEY=$SITE_KEY"
            echo "CMS_EXPECTED_PUBLISH_MODE=$PUBLISH_MODE"
            echo "CMS_PUBLISHED_CONTENT_PATH=$snapshot"
          } >> "$GITHUB_ENV"

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Validate snapshot images in content commit
        if: github.event_name == 'workflow_dispatch'
        run: node scripts/validate-cms-media.mjs
      - name: Type-check
        run: npm run lint
      - name: Build static site
        run: npm run build
      - name: Disable Jekyll processing
        run: touch out/.nojekyll
      - name: Upload Pages artifact
        if: github.event_name == 'workflow_dispatch' && inputs.publish_mode == 'production'
        uses: actions/upload-pages-artifact@v5
        with:
          path: out

  deploy:
    if: github.event_name == 'workflow_dispatch' && inputs.content_api_url == '' && inputs.publish_mode == 'production'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout content commit
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.commit_sha }}
          fetch-depth: 0
      - name: Reject superseded releases
        shell: bash
        env:
          COMMIT_SHA: ${{ inputs.commit_sha }}
          SITE_KEY: ${{ inputs.site_key }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin '+refs/heads/main:refs/remotes/origin/main'
          git merge-base --is-ancestor "$COMMIT_SHA" refs/remotes/origin/main || { echo '::error::Content commit is no longer on main'; exit 1; }
          snapshot=content/published-content-v1.json
          expected="$(git rev-parse "$COMMIT_SHA:$snapshot")"
          current="$(git rev-parse "refs/remotes/origin/main:$snapshot")"
          [[ "$expected" == "$current" ]] || { echo '::error::A newer CMS release superseded this deployment'; exit 1; }
          node scripts/verify-release-order.mjs
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  # Compatibility for older CMS clients; new local publishing does not use this path.
  legacy-build:
    if: github.event_name == 'workflow_dispatch' && inputs.content_api_url != ''
    runs-on: ubuntu-latest
    steps:
      - name: Validate CMS dispatch
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          ATTEMPT_NUMBER: ${{ inputs.attempt_number }}
          BUILD_TOKEN: ${{ secrets.CMS_BUILD_TOKEN }}
          CONTENT_API_URL: ${{ inputs.content_api_url }}
          DEPLOYMENT_ID: ${{ inputs.deployment_id }}
          RELEASE_ID: ${{ inputs.release_id }}
          SITE_KEY: ${{ inputs.site_key }}
          STATUS_TOKEN: ${{ secrets.CMS_DEPLOYMENT_STATUS_TOKEN }}
        run: |
          set -euo pipefail

          uuid_pattern='^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-5][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$'
          [[ "$DEPLOYMENT_ID" =~ $uuid_pattern ]] || {
            echo "::error::deployment_id must be a UUID"
            exit 1
          }
          [[ "$RELEASE_ID" =~ $uuid_pattern ]] || {
            echo "::error::release_id must be a UUID"
            exit 1
          }
          [[ "$SITE_KEY" =~ ^[a-z0-9][a-z0-9_-]{0,63}$ ]] || {
            echo "::error::site_key is invalid"
            exit 1
          }
          [[ "$ATTEMPT_NUMBER" =~ ^[1-9][0-9]*$ ]] || {
            echo "::error::attempt_number must be a positive integer"
            exit 1
          }
          [[ "$CONTENT_API_URL" =~ ^https:// ]] || {
            echo "::error::content_api_url must use HTTPS"
            exit 1
          }
          [[ -n "$BUILD_TOKEN" ]] || {
            echo "::error::CMS_BUILD_TOKEN is not configured"
            exit 1
          }
          [[ -n "$STATUS_TOKEN" ]] || {
            echo "::error::CMS_DEPLOYMENT_STATUS_TOKEN is not configured"
            exit 1
          }

      - name: Report CMS deployment started
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          ATTEMPT_NUMBER: ${{ inputs.attempt_number }}
          CONTENT_API_URL: ${{ inputs.content_api_url }}
          DEPLOYMENT_ID: ${{ inputs.deployment_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          RUN_ID: ${{ github.run_id }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          STATUS_TOKEN: ${{ secrets.CMS_DEPLOYMENT_STATUS_TOKEN }}
        run: |
          set -euo pipefail

          recorded_at="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          payload="$(jq -n \
            --arg attempt "$ATTEMPT_NUMBER" \
            --arg event_id "github-$RUN_ID-$RUN_ATTEMPT-started" \
            --arg recorded_at "$recorded_at" \
            --arg run_id "$RUN_ID" \
            --arg run_url "$RUN_URL" \
            '{
              attemptNumber: ($attempt | tonumber),
              status: "in_progress",
              providerWorkflowRunId: $run_id,
              providerStatus: "in_progress",
              providerEventId: $event_id,
              workflowUrl: $run_url,
              recordedAt: $recorded_at,
              details: { source: "github-actions" }
            }')"

          curl --fail-with-body --silent --show-error \
            --retry 3 --retry-all-errors --retry-delay 2 \
            --request POST \
            --header "Content-Type: application/json" \
            --header "X-CMS-Deployment-Status-Token: $STATUS_TOKEN" \
            --data "$payload" \
            "${CONTENT_API_URL%/}/deployments/$DEPLOYMENT_ID/status"

      - name: Fetch immutable CMS snapshot
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          BUILD_TOKEN: ${{ secrets.CMS_BUILD_TOKEN }}
          CONTENT_API_URL: ${{ inputs.content_api_url }}
          RELEASE_ID: ${{ inputs.release_id }}
          SITE_KEY: ${{ inputs.site_key }}
        run: |
          set -euo pipefail

          snapshot_path="$RUNNER_TEMP/published-content.json"
          curl --fail-with-body --silent --show-error \
            --retry 3 --retry-all-errors --retry-delay 2 \
            --get \
            --header "X-CMS-Build-Token: $BUILD_TOKEN" \
            --data-urlencode "siteKey=$SITE_KEY" \
            --data-urlencode "releaseId=$RELEASE_ID" \
            --output "$snapshot_path" \
            "${CONTENT_API_URL%/}/build/content"

          jq -e --arg release_id "$RELEASE_ID" \
            '.schemaVersion == "1.0" and .releaseId == $release_id' \
            "$snapshot_path" >/dev/null
          echo "Validated CMS snapshot $(sha256sum "$snapshot_path" | cut -d ' ' -f 1)"
          {
            echo "CMS_CONTENT_REQUIRED=1"
            echo "CMS_EXPECTED_RELEASE_ID=$RELEASE_ID"
            echo "CMS_PUBLISHED_CONTENT_PATH=$snapshot_path"
          } >> "$GITHUB_ENV"

      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run lint

      - name: Build static site
        run: npm run build

      - name: Disable Jekyll processing
        run: touch out/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: out

  legacy-deploy:
    if: github.event_name == 'workflow_dispatch' && inputs.content_api_url != '' && github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: legacy-build
    steps:
      - name: Check for local publishing cutover
        uses: actions/checkout@v7
        with:
          ref: main
      - name: Reject legacy deploy after local publishing begins
        shell: bash
        run: |
          set -euo pipefail
          snapshot=content/published-content-v1.json
          if [[ -f "$snapshot" ]] && jq -e '.siteKey != null and .publishMode != null' "$snapshot" >/dev/null; then
            echo '::error::Legacy publishing is disabled after local publishing cutover'
            exit 1
          fi
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  legacy-report:
    if: ${{ always() && github.event_name == 'workflow_dispatch' && inputs.content_api_url != '' }}
    runs-on: ubuntu-latest
    needs: [legacy-build, legacy-deploy]
    steps:
      - name: Report CMS deployment result
        shell: bash
        env:
          ATTEMPT_NUMBER: ${{ inputs.attempt_number }}
          BUILD_RESULT: ${{ needs.legacy-build.result }}
          COMMIT_SHA: ${{ github.sha }}
          CONTENT_API_URL: ${{ inputs.content_api_url }}
          DEPLOYMENT_ID: ${{ inputs.deployment_id }}
          DEPLOY_RESULT: ${{ needs.legacy-deploy.result }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          RUN_ID: ${{ github.run_id }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          STATUS_TOKEN: ${{ secrets.CMS_DEPLOYMENT_STATUS_TOKEN }}
        run: |
          set -euo pipefail

          [[ "$CONTENT_API_URL" =~ ^https:// ]] || {
            echo "::error::content_api_url must use HTTPS"
            exit 1
          }
          [[ -n "$STATUS_TOKEN" ]] || {
            echo "::error::CMS_DEPLOYMENT_STATUS_TOKEN is not configured"
            exit 1
          }

          if [[ "$DEPLOY_RESULT" == "success" ]]; then
            status="succeeded"
            provider_status="completed:success"
            failure_message=""
          elif [[ "$BUILD_RESULT" == "cancelled" || "$DEPLOY_RESULT" == "cancelled" ]]; then
            status="cancelled"
            provider_status="completed:cancelled"
            failure_message="GitHub workflow was cancelled"
          else
            status="failed"
            provider_status="completed:failure"
            failure_message="GitHub build=$BUILD_RESULT deploy=$DEPLOY_RESULT"
          fi

          recorded_at="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          payload="$(jq -n \
            --arg attempt "$ATTEMPT_NUMBER" \
            --arg build_result "$BUILD_RESULT" \
            --arg commit_sha "$COMMIT_SHA" \
            --arg deploy_result "$DEPLOY_RESULT" \
            --arg event_id "github-$RUN_ID-$RUN_ATTEMPT-terminal" \
            --arg failure_message "$failure_message" \
            --arg provider_status "$provider_status" \
            --arg recorded_at "$recorded_at" \
            --arg run_id "$RUN_ID" \
            --arg run_url "$RUN_URL" \
            --arg status "$status" \
            '{
              attemptNumber: ($attempt | tonumber),
              status: $status,
              providerWorkflowRunId: $run_id,
              providerStatus: $provider_status,
              providerEventId: $event_id,
              workflowUrl: $run_url,
              commitSha: $commit_sha,
              failureMessage: (
                if $failure_message == "" then null else $failure_message end
              ),
              recordedAt: $recorded_at,
              details: {
                source: "github-actions",
                buildResult: $build_result,
                deployResult: $deploy_result
              }
            }')"

          curl --fail-with-body --silent --show-error \
            --retry 3 --retry-all-errors --retry-delay 2 \
            --request POST \
            --header "Content-Type: application/json" \
            --header "X-CMS-Deployment-Status-Token: $STATUS_TOKEN" \
            --data "$payload" \
            "${CONTENT_API_URL%/}/deployments/$DEPLOYMENT_ID/status"
